name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      - name: E2E — scaffold + build a content-repo
        run: |
          node dist/cli.js e2e-test-blog
          cd e2e-test-blog
          # scaffolder wires git itself: real .gitignore + initial commit
          test -f .gitignore
          git log --oneline -1 | grep -q "init content-repo"
          mise install
          # regression (import-scaffold-gaps): pages honor redirect_from
          cat > content/pages/legacy-page.typ <<'EOF'
          #let meta = (
            title: "Legacy page",
            redirect_from: ("/p/legacy-page", "/legacy.html"),
          )
          #context metadata((meta))

          = Legacy page
          EOF
          # regression (import-scaffold-gaps): meta eval passes --features html
          # so content using #html.elem (raw HTML iframes) survives read_meta
          cat > "content/posts/$(date +%F)-embed-check.typ" <<EOF
          #let meta = (
            title: "Embed check",
            date: "$(date +%F)",
            tags: ("test",),
            draft: false,
          )
          #context metadata((meta))

          = Embed check

          #html.elem("iframe", attrs: (src: "https://example.com", width: "560", height: "315"))
          EOF
          python3 .agents/skills/build/scripts/build.py
          python3 .agents/skills/build/scripts/build.py --verify
          test -f build/index.html
          test -f build/atom.xml
          grep -q '^/p/legacy-page    /legacy-page/$' build/_redirects
          grep -q '^/legacy.html    /legacy-page/$' build/_redirects
          grep -q '<iframe' "build/$(date +%Y)/$(date +%m)/$(date +%d)/embed-check/index.html"
          # example post is dated "today" at scaffold time — find it dynamically
          find build -path "*hello-world/index.html" | grep -q .
          # bare names resolve via mise shims (mise-action put them on PATH;
          # shims read the scaffolded repo's own mise.toml from cwd)
          prek validate-config
          prek run --all-files
      - name: E2E — serve skill watches and rebuilds
        run: |
          node dist/cli.js e2e-serve-blog
          cd e2e-serve-blog
          mise install
          python3 .agents/skills/serve/scripts/serve.py --port 3111 >serve.log 2>&1 &
          SRV=$!
          # up + initial build done
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3111/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3111/ | grep -q "Hello, world"
          # edit a post's meta title -> watch rebuild -> listing reflects it
          sed -i 's/title: "Hello, world"/title: "Hello, edited world"/' \
            "content/posts/$(date +%F)-hello-world.typ"
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3111/ 2>/dev/null | grep -q "Hello, edited world" && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3111/ | grep -q "Hello, edited world"
          # and the rebuilt post page too
          curl -fsS "http://127.0.0.1:3111/$(date +%Y)/$(date +%m)/$(date +%d)/hello-world/" \
            | grep -q "Hello, edited world"
          kill $SRV
          grep -q "serve: build ok" serve.log

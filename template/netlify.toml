# Netlify build config. The build image does not officially ship mise, but
# build.sh bootstraps it if missing, installs the pinned typst from
# mise.toml, and runs the build. mise.toml stays the single source of truth
# for tool versions.
[build]
  command = "./build.sh"
  publish = "build"

[build.environment]
  MISE_YES = "1"
